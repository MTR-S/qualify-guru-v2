services:
  api:
    build: .
    image: qualify-guru-api
    container_name: qualify-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - minio
    environment:
      - PROFILE=local
      - DATASOURCE_URL=${DATASOURCE_URL_PRD}
      - DATASOURCE_USER=${DATASOURCE_USER}
      - DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}

      - MINIO_ENDPOINT=${MINIO_ENDPOINT_PRD}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}

      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}

  mysql:
    image: mysql:8.0
    container_name: qualify-guru-v2-mysql
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - MYSQL_USER=${DATASOURCE_USER}
      - MYSQL_PASSWORD=${DATASOURCE_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: qualify-minio
    restart: always
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data: