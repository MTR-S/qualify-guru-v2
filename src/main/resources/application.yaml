spring:

  profiles:
    active: ${PROFILE:local}

  application:
    name: qualify-guru-v2

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/qualify_guru_v2_local}
    username: ${DATASOURCE_USER:root}
    password: ${DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dummy-local-api-key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.6-flash}
            temperature: ${GEMINI_TEMPERATURE:0.0}

  minio:
    access-key: ${MINIO_ACCESS_KEY:minioaccesskey}
    secret-key: ${MINIO_SECRET_KEY:miniosecretkey}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}


security:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWR1bW15LXNlY3JldC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXM=}