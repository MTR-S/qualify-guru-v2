spring:
  http:
    converters:
      preferred-json-mapper: jackson2

  datasource:
    url: jdbc:h2:mem:modulith-test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

  ai:
    google:
      genai:
        api-key: dummy-test-key

