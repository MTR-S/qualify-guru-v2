spring:
  application:
    name: qualify-guru-v2

  datasource:
    url: jdbc:mysql://localhost:3306/qualify_guru_v2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
            temperature: 0.0

security:
  jwt:
    secret: ${JWT_SECRET}